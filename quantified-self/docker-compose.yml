services:
  timescaledb:
    image: timescale/timescaledb:latest-pg18
    container_name: qs_timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_USER=qs_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=quantified_self
      - PGDATA=/pgdata
      - TIMESCALEDB_TELEMETRY=off
    volumes:
      - /mnt/ssd/quantified-self/postgres_data:/pgdata
    networks:
      - qs_net
    ports:
      - "127.0.0.1:5432:5432"

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: qs_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_PLUGINS_PREINSTALL=grafana-clock-panel,yesoreyeram-infinity-datasource
    volumes:
      - /mnt/ssd/quantified-self/grafana_data:/var/lib/grafana
    networks:
      - qs_net
    ports:
      - "3010:3000"
    depends_on:
      - timescaledb

networks:
  qs_net:
    name: qs_net
    driver: bridge