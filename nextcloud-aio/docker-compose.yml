services:
  nextcloud-aio-mastercontainer:
    image: ghcr.io/nextcloud-releases/all-in-one:latest
    init: true
    restart: always
    container_name: nextcloud-aio-mastercontainer # DO NOT CHANGE THIS LINE HERE
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config # DO NOT CHANGE THIS LINE HERE
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: bridge
    ports: 
      - "8080:8080"
    environment:
      APACHE_PORT: 11000
      APACHE_IP_BINDING: 127.0.0.1
      NEXTCLOUD_DATADIR: /mnt/ssd/ncdata
      SKIP_DOMAIN_VALIDATION: false
      TALK_PORT: 3478
      WATCHTOWER_DOCKER_SOCKET_PATH: /var/run/docker.sock

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer # DO NOT CHANGE THIS LINE HERE
