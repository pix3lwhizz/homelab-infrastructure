services:
  broker:
    image: docker.io/valkey/valkey:8-alpine
    container_name: paperless-broker
    restart: unless-stopped
    volumes:
      - /mnt/ssd/paperless/redisdata:/data

  db:
    image: docker.io/library/postgres:18
    container_name: paperless-db
    restart: unless-stopped
    volumes:
      - /mnt/ssd/paperless/pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASS}

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0
    container_name: paperless-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      - db
      - broker
    volumes:
      - /mnt/ssd/paperless/data:/usr/src/paperless/data
      - /mnt/hdd/paperless/media:/usr/src/paperless/media
      - /mnt/ssd/paperless/export:/usr/src/paperless/export
      - /mnt/ssd/paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_SECRET_KEY: ${PAPERLESS_KEY}
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASS}
      PAPERLESS_URL: ${PAPERLESS_URL}
      USERMAP_UID: 1000
      USERMAP_GID: 1000
      PAPERLESS_TIME_ZONE: Europe/Vienna
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASS}
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.paperless-export.schedule: "0 0 23 * * *"
      ofelia.job-exec.paperless-export.command: "document_exporter /usr/src/paperless/export -d"
  
  backup:
    image: offen/docker-volume-backup:latest
    container_name: paperless-backup
    restart: always
    environment:
      - BACKUP_CRON_EXPRESSION=30 23 * * *
      - BACKUP_SOURCES=/backup/export
      - BACKUP_FILENAME=paperless-export-%Y-%m-%dT%H-%M-%S.tar.gz
      - BACKUP_RETENTION_DAYS=14
      - TZ=Europe/Vienna
      - NOTIFICATION_URLS=${NOTIFICATION_URLS}
      - EXEC_LABEL=paperless
    volumes:
      - /mnt/ssd/paperless/export:/backup/export:ro
      - /mnt/hdd/paperless_backups:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - docker-volume-backup.exec-label=paperless
      - docker-volume-backup.prune-post=${DOCKER_BACKUP}