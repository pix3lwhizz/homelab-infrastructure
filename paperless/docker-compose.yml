services:
  broker:
    image: docker.io/library/redis:8
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - /mnt/ssd/paperless/redisdata:/data

  db:
    image: docker.io/library/postgres:18
    container_name: paperless-db
    restart: unless-stopped
    volumes:
      - /mnt/ssd/paperless/pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASS}

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      - db
      - broker
    volumes:
      - /mnt/ssd/paperless/data:/usr/src/paperless/data
      - /mnt/hdd/paperless/media:/usr/src/paperless/media
      - /mnt/ssd/paperless/export:/usr/src/paperless/export
      - /mnt/ssd/paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASS}
      PAPERLESS_URL: ${PAPERLESS_URL}
      USERMAP_UID: 1000
      USERMAP_GID: 1000
      PAPERLESS_TIME_ZONE: Europe/Vienna
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASS}
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.paperless-export.schedule: "0 0 23 * * *"
      ofelia.job-exec.paperless-export.command: "document_exporter /usr/src/paperless/export -d"