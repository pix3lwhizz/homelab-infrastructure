services:
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      - /mnt/ssd/ai-stack/9router/data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      INITIAL_PASSWORD: "${INITIAL_PASSWORD}"
    networks:
      - ai_net

  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    command: gateway run
    shm_size: '1gb'
    networks:
      - ai_net
      - hermes_net
    ports:
      - "8642:8642" # API Server
      - "9119:9119" # Web Dashboard
    volumes:
      - /mnt/ssd/ai-stack/hermes/data:/opt/data
      - /srv/stacks-mirror:/opt/stacks:ro
      - /srv/backup-mirror:/opt/backup:ro
      - /mnt/hdd/data:/data:ro
      - /mnt/hdd/data/hermes:/opt/media
      - /mnt/hdd/data/media/music:/media/music
      - /mnt/hdd/data/custom/music_custom:/media/custom
      - /mnt/ssd/homepage/config:/opt/homepage
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD}
      - PUID=1000
      - PGID=1000
  
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      NETWORKS: 1
      EVENTS: 1
      POST: 0
      EXEC: 0
      BUILD: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - hermes_net

networks:
  ai_net:
    name: ai_net
    driver: bridge
  hermes_net:
    name: hermes_net
    driver: bridge