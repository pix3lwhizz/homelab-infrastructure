services:
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vienna
    volumes:
      - /mnt/ssd/kavita/config:/config
      - /mnt/hdd/data:/data
    ports:
      - 127.0.0.1:5000:5000
    restart: unless-stopped