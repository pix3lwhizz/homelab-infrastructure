services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    tty: true
    stdin_open: true
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "25565:25565"        # Java
      - "19132:19132/udp"    # Bedrock (Geyser)
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.3"
      MEMORY: "6G"
      USE_AIKAR_FLAGS: "true"
      MAX_PLAYERS: "2"
      MOTD: "Vanilla Remaster 26.3"
      TZ: "Europe/Vienna"
      DIFFICULTY: "3"
      SIMULATION_DISTANCE: "10"
      VIEW_DISTANCE: "12"
      LEVEL: "${LEVEL_NAME}"
      SPAWN_PROTECTION: "0"
      REGION_FILE_COMPRESSION: "lz4"

      OPS: |-
        ${MC_USER}
      ENABLE_WHITELIST: "true"
      WHITELIST: |-
        ${MC_USER}

      MODRINTH_PROJECTS: |-
        ferrite-core
        lithium
        appleskin
        krypton
        clumps
        c2me-fabric
        scalablelux
        distanthorizons
        chunky
        spark
        geyser
        floodgate

      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      MODRINTH_ALLOWED_VERSION_TYPE: "alpha"

      HIDE_ONLINE_PLAYERS: "true"
      ALLOW_FLIGHT: "true"
      ENABLE_ROLLING_LOGS: "true"
    volumes:
      - "/mnt/ssd/minecraft/data:/data"
    healthcheck:
      test: mc-health
      start_period: 2m
      interval: 10s
      retries: 3
